name: Isolated Rime locale diagnostics

on:
  push:
    branches: [diagnose-rime-cache]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - shell: pwsh
        run: git config --global core.autocrlf true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 1
      - name: Compile targeted test and compare isolated locales
        shell: pwsh
        run: ./scripts/ci/diagnose-rime-locale.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rime-locale-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/ziliu-rime-diagnostic/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: false
