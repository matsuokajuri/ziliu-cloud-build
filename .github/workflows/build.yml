name: Windows build and strict tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    env:
      ZILIU_WINDOWS_SDK_VERSION: 10.0.26100.0
      ZILIU_NUGET_SOURCES: https://api.nuget.org/v3/index.json
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve reviewed dependency byte identity
        shell: pwsh
        run: git config --global core.autocrlf true

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 1

      - name: Build all products, require real Rime, test and package
        shell: pwsh
        run: ./scripts/ci/windows-build.ps1

      - name: Retain bounded build evidence and unsigned packages
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/ziliu-evidence/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false
